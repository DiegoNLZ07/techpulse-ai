name: TechPulse AI CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-tests:
    name: Backend API & ML Test Suite
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Seed SQLite Database
        run: |
          python -m backend.app.db.seed

      - name: Train & Validate Machine Learning Artifact
        run: |
          mkdir -p backend/data
          python -m backend.app.ml.train

      - name: Run Pytest Suite
        run: |
          pytest backend/tests/test_api_and_ml.py -v

  frontend-build:
    name: Frontend Vue 3 SPA Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci || npm install

      - name: Build Production Assets (Vite)
        working-directory: frontend
        run: npm run build
